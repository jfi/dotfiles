---
name: Lint

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Markdown files
        run: markdownlint-cli2 --config .config/.markdownlint.yml '**/*.md'

      - name: Lint YAML files
        run: yamllint -c .config/.yamllint.yml .

      - name: Lint shell scripts
        run: |
          find . -type f \( -name '*.sh' -o -path './setup/*' -o -path './bin/*' -o -name 'install' \) \
            -not -path './.git/*' \
            -exec shellcheck {} +

  setup-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test setup with system Bash and a disposable HOME
        run: python3 -m unittest discover -s tests -p test_setup.py -v
